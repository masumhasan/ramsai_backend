<script>
        // Micro-interactions and scanner behavior
        const flashBtn = document.getElementById('flash-toggle');
        let flashOn = false;

        flashBtn.addEventListener('click', () => {
            flashOn = !flashOn;
            const icon = flashBtn.querySelector('.material-symbols-outlined');
            icon.textContent = flashOn ? 'flashlight_off' : 'flashlight_on';
            flashBtn.classList.toggle('text-primary', flashOn);
            flashBtn.classList.toggle('bg-primary/20', flashOn);
        });

        // Simulate a successful scan after 4 seconds
        const scanTarget = document.getElementById('scan-target');
        const feedback = document.getElementById('success-feedback');
        const feedbackInner = feedback.querySelector('div');

        setTimeout(() => {
            feedback.classList.remove('opacity-0', 'pointer-events-none');
            feedbackInner.classList.remove('scale-90');
            feedbackInner.classList.add('scale-100');
            
            // Redirect back or hide after 2 seconds
            setTimeout(() => {
                feedback.classList.add('opacity-0');
            }, 2000);
        }, 5000);

        // Haptic feedback simulation on interactions
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', () => {
                if (window.navigator.vibrate) {
                    window.navigator.vibrate(10);
                }
            });
        });
    </script>
