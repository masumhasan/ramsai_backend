<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Fitness Dashboard</title>
<!-- Tailwind CSS v3 CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style data-purpose="custom-fonts">
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
<style data-purpose="custom-colors">
    .bg-main-blue { background-color: #4A90E2; }
    .bg-card-dark { background-color: #121212; }
    .bg-inner-dark { background-color: #0A0A0A; }
    .text-muted { color: #8E8E93; }
    .accent-blue { background-color: #3B82F6; }
    .streak-orange { background: linear-gradient(135deg, #FF9500 0%, #FF5E3A 100%); }
  </style>
</head>
<body class="bg-black text-white min-h-screen flex justify-center">
<!-- Main Mobile Container -->
<main class="w-full max-w-[375px] min-h-screen bg-black relative flex flex-col overflow-hidden">
<!-- BEGIN: HeaderSection -->
<header class="bg-main-blue p-6 pb-12 rounded-b-[40px] relative z-10">
<!-- Status Bar Area Placeholder -->
<div class="flex justify-between items-center mb-6 text-xs font-semibold">
<span class="">11:52</span>
<div class="flex gap-1 items-center">
<svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21l-12-18h24z"></path></svg>
<svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L4.5 20.29L5.21 21L12 18L18.79 21L19.5 20.29L12 2Z"></path></svg>
</div>
</div>
<!-- User Greeting & Date -->
<div class="flex justify-between items-start mb-8">
<div data-purpose="user-info">
<p class="text-white/80 text-sm">Good morning,</p>
<h1 class="text-2xl font-bold">Sheikh Hasina</h1>
</div>
<div class="text-right flex flex-col items-end" data-purpose="date-info">
<p class="text-white/80 text-xs">Tuesday, July 14</p>
<p class="text-xl font-bold">11:51 AM</p>
<div class="mt-2 bg-white/20 p-2 rounded-full">
<svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
</div>
</div>
</div>
<!-- Streak Card -->
<div class="bg-white/20 backdrop-blur-md rounded-3xl p-4 flex items-center gap-4 border border-white/10" data-purpose="streak-card">
<div class="streak-orange w-12 h-12 rounded-full flex items-center justify-center shadow-lg">
<svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 20 20"><path clip-rule="evenodd" d="M12.395 2.553a1 1 0 00-1.45-.385c-.345.23-.614.558-.822.88-.214.33-.403.713-.57 1.116-.334.804-.614 1.768-.84 2.734a31.365 31.365 0 00-.613 3.58 2.64 2.64 0 01-.945-1.067c-.328-.68-.398-1.534-.398-2.654A1 1 0 005.05 6.05 6.981 6.981 0 003 11a7 7 0 1014 0c0-1.307-.349-2.533-.967-3.588a1 1 0 00-1.75.367c-.03.112-.05.223-.061.335a2.705 2.705 0 01-.137.713 5.487 5.487 0 01-.412.817 4.93 4.93 0 01-1.083 1.478 4.335 4.335 0 01-1.25.77 1.991 1.991 0 01-1.944-.223 3.543 3.543 0 00-.73-.41 3.28 3.28 0 00-1.012-.267c.18-.838.455-1.588.755-2.214.303-.626.62-1.137.88-1.504a3.332 3.332 0 01.371-.465 1 1 0 00.158-1.266z" fill-rule="evenodd"></path></svg>
</div>
<div>
<h3 class="font-bold text-lg">0 Day Streak</h3>
<p class="text-white/80 text-sm">Keep it up! 🔥</p>
</div>
</div>
</header>
<!-- END: HeaderSection -->
<!-- BEGIN: DailyLogsSection -->
<section class="px-4 -mt-6 relative z-20" data-purpose="daily-logs-container">
<div class="bg-card-dark rounded-[32px] p-6 shadow-2xl">
<div class="flex justify-between items-start mb-2">
<div>
<h2 class="text-xl font-bold mb-1">Daily Logs</h2>
<div class="flex items-baseline gap-1">
<span class="text-3xl font-bold">0/</span>
<span class="text-muted text-sm">1800 cal remaining</span>
</div>
<p class="text-muted text-xs mt-1">Start logging meals</p>
</div>
<!-- Progress Ring Chart -->
<div class="relative w-24 h-24 flex items-center justify-center">
<svg class="w-full h-full transform -rotate-90">
<circle cx="48" cy="48" fill="transparent" r="38" stroke="#1C1C1E" stroke-width="12"></circle>
<!-- Placeholder for 0% progress -->
</svg>
<span class="absolute text-xl font-bold">0%</span>
</div>
</div>
<!-- Macro Progress Bars -->
<div class="grid grid-cols-3 gap-4 mb-6">
<div data-purpose="macro-protein">
<p class="text-muted text-[10px] mb-1">Protein</p>
<p class="text-xs font-bold mb-1">0g/112g</p>
<div class="h-1 w-full bg-[#1C1C1E] rounded-full overflow-hidden">
<div class="h-full bg-blue-400 w-0"></div>
</div>
</div>
<div data-purpose="macro-carbs">
<p class="text-muted text-[10px] mb-1">Carbs</p>
<p class="text-xs font-bold mb-1">0g/202g</p>
<div class="h-1 w-full bg-[#1C1C1E] rounded-full overflow-hidden">
<div class="h-full bg-orange-400 w-0"></div>
</div>
</div>
<div data-purpose="macro-fat">
<p class="text-muted text-[10px] mb-1">Fat</p>
<p class="text-xs font-bold mb-1">0g/60g</p>
<div class="h-1 w-full bg-[#1C1C1E] rounded-full overflow-hidden">
<div class="h-full bg-teal-400 w-0"></div>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="flex flex-col gap-3">
<button class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-2xl flex items-center justify-center gap-2 transition-colors" data-purpose="log-activity-btn">
<span class="text-xl">+</span>
            Log Activity
          </button>
<!-- Requested New Button -->
<button class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-2xl flex items-center justify-center gap-2 transition-colors" data-purpose="scan-product-btn" onclick="window.location.href='{{DATA:SCREEN:SCREEN_8}}'">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
<path d="M12 11h.01M12 15h.01M16 11h.01M16 15h.01" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
            Scan Product
          </button>
</div>
</div>
</section>
<!-- END: DailyLogsSection -->
<!-- BEGIN: TodayWorkoutSection -->
<section class="px-4 mt-6">
<div class="bg-inner-dark rounded-3xl p-6 border border-white/5">
<h2 class="text-lg font-bold mb-4">Today's Workout</h2>
<p class="text-white text-sm mb-4">Cardio &amp; Core - 5 exercises</p>
<button class="text-white text-sm font-semibold flex items-center gap-1 group">
          View Workouts 
          <span class="group-hover:translate-x-1 transition-transform">→</span>
</button>
</div>
</section>
<!-- END: TodayWorkoutSection -->
<!-- BEGIN: QuickStatsSection -->
<section class="px-4 mt-6 grid grid-cols-2 gap-4 pb-24">
<div class="bg-inner-dark rounded-3xl p-4 flex flex-col items-center justify-center relative overflow-hidden h-32">
<!-- Glow Effect -->
<div class="absolute -top-10 -left-10 w-24 h-24 bg-purple-600/20 blur-[40px]"></div>
<div class="bg-purple-500/20 p-3 rounded-full mb-2">
<svg class="w-6 h-6 text-purple-400" fill="currentColor" viewBox="0 0 24 24"><path d="M20.5 5.5l-1.91 1.91C19.39 8.35 20 9.6 20 11c0 1.4-.61 2.65-1.41 3.59L20.5 16.5c1.1-1.39 1.5-3.09 1.5-5s-.4-3.61-1.5-5zm-3.82 3.82l-1.91 1.91C14.89 11.35 15 11.6 15 12c0 .4-.11.65-.23.77L16.68 14.68C17.5 13.5 18 12.5 18 11.5c0-1-.5-2-1.32-3.18zM12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6zM5.32 9.32l1.91-1.91C6.61 6.65 6 5.5 6 4.5c0-1 .5-2 1.32-3.18L5.32.32C4.1 1.61 3.5 3.31 3.5 5.5s.4 3.61 1.5 5z"></path></svg>
</div>
<span class="text-2xl font-bold">0</span>
</div>
<div class="bg-inner-dark rounded-3xl p-4 flex flex-col items-center justify-center relative overflow-hidden h-32">
<!-- Glow Effect -->
<div class="absolute -top-10 -left-10 w-24 h-24 bg-green-600/20 blur-[40px]"></div>
<div class="bg-green-500/20 p-3 rounded-full mb-2">
<svg class="w-6 h-6 text-green-400" fill="currentColor" viewBox="0 0 20 20"><path clip-rule="evenodd" d="M12.395 2.553a1 1 0 00-1.45-.385c-.345.23-.614.558-.822.88-.214.33-.403.713-.57 1.116-.334.804-.614 1.768-.84 2.734a31.365 31.365 0 00-.613 3.58 2.64 2.64 0 01-.945-1.067c-.328-.68-.398-1.534-.398-2.654A1 1 0 005.05 6.05 6.981 6.981 0 003 11a7 7 0 1014 0c0-1.307-.349-2.533-.967-3.588a1 1 0 00-1.75.367c-.03.112-.05.223-.061.335a2.705 2.705 0 01-.137.713 5.487 5.487 0 01-.412.817 4.93 4.93 0 01-1.083 1.478 4.335 4.335 0 01-1.25.77 1.991 1.991 0 01-1.944-.223 3.543 3.543 0 00-.73-.41 3.28 3.28 0 00-1.012-.267c.18-.838.455-1.588.755-2.214.303-.626.62-1.137.88-1.504a3.332 3.332 0 01.371-.465 1 1 0 00.158-1.266z" fill-rule="evenodd"></path></svg>
</div>
<span class="text-2xl font-bold">0</span>
</div>
</section>
<!-- END: QuickStatsSection -->
<!-- BEGIN: BottomNavigation -->
<nav class="fixed bottom-0 left-0 right-0 max-w-[375px] mx-auto bg-inner-dark/95 backdrop-blur-lg border-t border-white/5 flex justify-around items-center py-4 px-2 z-50">
<a class="flex flex-col items-center gap-1 group text-blue-400" href="#">
<div class="w-6 h-1 bg-blue-400 absolute top-0 rounded-b-full"></div>
<svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"></path></svg>
<span class="text-[10px] font-semibold">Dashboard</span>
</a>
<a class="flex flex-col items-center gap-1 text-muted hover:text-white transition-colors" href="#">
<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 2L4.5 20.29L5.21 21L12 18L18.79 21L19.5 20.29L12 2Z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
<span class="text-[10px] font-semibold">Workout</span>
</a>
<a class="flex flex-col items-center gap-1 text-muted hover:text-white transition-colors" href="{{DATA:SCREEN:SCREEN_8}}">
<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
<span class="text-[10px] font-semibold">Nutrition</span>
</a>
<a class="flex flex-col items-center gap-1 text-muted hover:text-white transition-colors" href="#">
<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
<span class="text-[10px] font-semibold">Progress</span>
</a>
<a class="flex flex-col items-center gap-1 text-muted hover:text-white transition-colors" href="#">
<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
<span class="text-[10px] font-semibold">Profile</span>
</a>
</nav>
<!-- END: BottomNavigation -->
</main>


</body></html>
